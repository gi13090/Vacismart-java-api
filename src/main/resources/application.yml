server:
  address: 127.0.0.1

vacismart:
  jwt:
    emissor: ${JWT_EMISSOR:vacismart}
    validade: ${JWT_VALIDADE:PT15M}
    chave-publica: ${JWT_CHAVE_PUBLICA:}
    chave-privada: ${JWT_CHAVE_PRIVADA:}
  cors:
    origens: ${CORS_ORIGENS:}

# Documentação desligada por padrão; não habilitar automaticamente em produção.
springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false
    persist-authorization: false
  packages-to-scan: br.com.fiap.vacismart.web.controller
  paths-to-match: /api/v1/**
  override-with-generic-response: false

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  application:
    name: vacismart-java-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    time-zone: America/Sao_Paulo
    datatype:
      datetime:
        write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vacismart}
    username: ${DB_USER:vacismart}
    # EXEMPLO exclusivo de desenvolvimento local; nunca usar em produção.
    password: ${DB_PASSWORD:exemplo-local-nao-producao}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:vacismart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: "(dev | test) & !prod & !production"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
